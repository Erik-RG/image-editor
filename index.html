<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelForge</title><link rel="stylesheet" href="styles.css?v=20">
</head>
<body>
<header class="appbar"><div class="app-title"><span class="logo">P</span><strong>PixelForge</strong></div><nav class="menus" aria-label="Application menu">
<button data-menu="file">File</button><button data-menu="edit">Edit</button><button data-menu="image">Image</button><button data-menu="layer">Layer</button><button data-menu="select">Select</button><button data-menu="filter">Filter</button><button data-menu="view">View</button><button data-menu="window">Window</button><button data-menu="help">Help</button>
</nav><div class="app-actions"><button id="openBtn">Open</button><button id="saveBtn">Export</button></div></header>
<div id="menuHost" class="menu-host"></div>
<div class="optionsbar"><div id="toolName" class="tool-name">Move Tool</div><div id="toolOptions" class="tool-options"></div><div class="options-spacer"></div><span id="docInfo">No document</span></div>
<main class="workspace"><aside class="toolbar" aria-label="Tools">
<button class="tool active" data-tool="move" title="Move (V)">↖<span>Move</span></button><button class="tool" data-tool="marquee" title="Marquee (M)">▣<span>Marquee</span></button><button class="tool" data-tool="lasso" title="Lasso">⌁<span>Lasso</span></button><button class="tool" data-tool="wand" title="Magic Wand">✧<span>Wand</span></button><button class="tool" data-tool="crop" title="Crop">⌗<span>Crop</span></button><button class="tool" data-tool="eyedropper" title="Eyedropper (I)">⌾<span>Picker</span></button><button class="tool" data-tool="brush" title="Brush (B)">✎<span>Brush</span></button><button class="tool" data-tool="pencil" title="Pencil">／<span>Pencil</span></button><button class="tool" data-tool="eraser" title="Eraser (E)">⌫<span>Eraser</span></button><button class="tool" data-tool="bucket" title="Paint Bucket">▰<span>Bucket</span></button><button class="tool" data-tool="gradient" title="Gradient">▤<span>Gradient</span></button><button class="tool" data-tool="blur" title="Blur">◌<span>Blur</span></button><button class="tool" data-tool="sharpen" title="Sharpen">◇<span>Sharpen</span></button><button class="tool" data-tool="text" title="Text (T)">T<span>Text</span></button><button class="tool" data-tool="shape" title="Shape">□<span>Shape</span></button><button class="tool" data-tool="zoom" title="Zoom (Z)">⌕<span>Zoom</span></button><button class="tool" data-tool="hand" title="Hand (Space)">✋<span>Hand</span></button>
<div class="swatches"><input id="fgColor" type="color" value="#111111" title="Foreground"><input id="bgColor" type="color" value="#ffffff" title="Background"><button id="swapColors" title="Swap colors">⇄</button></div></aside>
<section class="canvas-area"><div id="canvasViewport" class="canvas-viewport"><div id="canvasStage" class="canvas-stage"><canvas id="editorCanvas"></canvas><canvas id="overlayCanvas"></canvas></div></div><div class="canvas-controls"><button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button><button id="zoomFit">Fit</button><button id="zoom100">100%</button></div></section>
<aside class="rightbar"><section class="panel properties"><header><h2>Properties</h2></header><div id="propertiesBody"></div></section><section class="panel layers-panel"><header><h2>Layers</h2><div><button id="newLayer" title="New layer">＋</button><button id="deleteLayer" title="Delete layer">♲</button></div></header><div class="layer-tools"><button id="duplicateLayer">Duplicate</button><select id="blendMode"><option>normal</option><option>multiply</option><option>screen</option><option>overlay</option><option>darken</option><option>lighten</option></select><input id="layerOpacity" type="range" min="0" max="100" value="100"><output id="opacityValue">100%</output></div><ul id="layers"></ul></section><section class="panel history-panel"><header><h2>History</h2></header><ol id="history"></ol></section></aside></main>
<footer class="statusbar"><span id="status">Ready</span><span id="pointerInfo">x: — y: —</span><span id="layerInfo">Layer: —</span></footer>
<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<script type="module" src="app.js?v=20"></script>
</body></html>
