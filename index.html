<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelForge Studio</title><link rel="stylesheet" href="styles.css?v=11"></head>
<body><header class="topbar"><a class="brand" href="."><span class="brand-mark">✦</span><span>PixelForge <small>STUDIO</small></span></a><div class="actions"><button id="open" class="primary" type="button">Open image</button><input id="file" type="file" accept="image/*" hidden><button id="view" type="button" disabled>View</button><button id="export" type="button" disabled>Download</button><button id="reset" type="button">Reset</button></div></header>
<main><aside><section><h2>Light</h2><div class="adjustments"><div class="adjust" data-id="exposure" data-min="-100" data-max="100" data-value="0" data-label="Exposure"></div><div class="adjust" data-id="brightness" data-min="-100" data-max="100" data-value="0" data-label="Brightness"></div><div class="adjust" data-id="contrast" data-min="-100" data-max="100" data-value="0" data-label="Contrast"></div><div class="adjust" data-id="highlights" data-min="-100" data-max="100" data-value="0" data-label="Highlights"></div><div class="adjust" data-id="shadows" data-min="-100" data-max="100" data-value="0" data-label="Shadows"></div></div></section><section><h2>Color</h2><div class="adjustments"><div class="adjust" data-id="temperature" data-min="-100" data-max="100" data-value="0" data-label="Temperature"></div><div class="adjust" data-id="tint" data-min="-100" data-max="100" data-value="0" data-label="Tint"></div><div class="adjust" data-id="saturation" data-min="-100" data-max="100" data-value="0" data-label="Saturation"></div><div class="adjust" data-id="vibrance" data-min="-100" data-max="100" data-value="0" data-label="Vibrance"></div><div class="adjust" data-id="hue" data-min="-180" data-max="180" data-value="0" data-label="Hue"></div></div></section><section><h2>Tools</h2><div class="tools"><button class="tool active" data-tool="select" type="button">Select</button><button class="tool" data-tool="brush" type="button">Brush</button><button class="tool" data-tool="text" type="button">Text</button></div><label>Brush size <output id="sizeOut">12px</output><input id="size" type="range" min="2" max="80" value="12"></label><label class="color-label">Ink color <input id="color" type="color" value="#ff5d73"></label></section></aside><section class="editor-shell"><div class="editor-toolbar"><span id="status">Ready for your next idea</span><div class="zoom-controls"><button id="zoomOut" type="button">−</button><output id="zoomLabel">100%</output><button id="zoomIn" type="button">+</button><button id="fit" type="button">Fit</button></div></div><div id="stage" class="stage"><canvas id="canvas" width="900" height="600"></canvas><div id="empty" class="empty"><strong>Drop an image here</strong><span>Open an image to begin editing</span></div></div></section></main><script src="app.js?v=11"></script></body></html>
