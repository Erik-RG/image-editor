<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PixelForge Studio</title>
  <link rel="stylesheet" href="styles.css?v=7">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="."><span class="brand-mark">✦</span><span>PixelForge <small>STUDIO</small></span></a>
    <div class="actions"><button id="open" class="primary" type="button">↥ Open image</button><input id="file" type="file" accept="image/*" hidden><button id="export" type="button">↓ Export</button><button id="reset" type="button">Reset</button></div>
  </header>
  <main>
    <aside>
      <section><h2>Adjustments</h2>
        <label>Brightness <output id="brightnessOut">100%</output><input id="brightness" type="range" min="0" max="200" value="100"></label>
        <label>Contrast <output id="contrastOut">100%</output><input id="contrast" type="range" min="0" max="200" value="100"></label>
        <label>Saturation <output id="saturationOut">100%</output><input id="saturation" type="range" min="0" max="200" value="100"></label>
        <label>Grayscale <output id="grayscaleOut">0%</output><input id="grayscale" type="range" min="0" max="100" value="0"></label>
        <label>Sepia <output id="sepiaOut">0%</output><input id="sepia" type="range" min="0" max="100" value="0"></label>
        <label>Hue <output id="hueOut">0°</output><input id="hue" type="range" min="0" max="360" value="0"></label>
      </section>
      <section><h2>Tools</h2><div class="tools"><button class="tool active" data-tool="select" type="button">Select</button><button class="tool" data-tool="brush" type="button">Brush</button><button class="tool" data-tool="text" type="button">Text</button></div><label>Brush size <output id="sizeOut">12px</output><input id="size" type="range" min="2" max="50" value="12"></label><label class="color-label">Ink color <input id="color" type="color" value="#ff5d73"></label></section>
    </aside>
    <section class="editor-shell"><div class="editor-toolbar"><span id="status">Ready for your next idea</span><div class="zoom-controls"><button id="zoomOut" type="button">−</button><output id="zoomOutLabel">100%</output><button id="zoomIn" type="button">+</button><button id="fit" type="button">Fit</button></div></div><div id="stage" class="stage"><canvas id="canvas" width="900" height="600"></canvas><div id="empty" class="empty"><strong>Drop an image here</strong><span>or use Open image to get started</span></div></div></section>
  </main>
  <script src="app.js?v=7"></script>
</body>
</html>
