<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PixelForge</title><link rel="stylesheet" href="styles.css?v=20"><link rel="stylesheet" href="custom-controls.css?v=20">
</head>
<body>
<header class="appbar"><div class="app-title"><span class="logo">P</span><strong>PixelForge</strong></div><nav class="menus" aria-label="Application menu">
<button data-menu="file">File</button><button data-menu="edit">Edit</button><button data-menu="image">Image</button><button data-menu="layer">Layer</button><button data-menu="select">Select</button><button data-menu="view">View</button></nav><div class="app-actions"><button id="openBtn">Open</button><button id="saveBtn">Export</button></div></header>
<div id="menuHost" class="menu-host"></div>
<div class="optionsbar"><div id="toolName" class="tool-name">Move Tool</div><div id="toolOptions" class="tool-options"></div><div class="options-spacer"></div><span id="docInfo">No document</span></div>
<main class="workspace"><aside class="toolbar" aria-label="Tools">
<button class="tool active" data-tool="move" title="Move (V)">↖<span>Move</span></button><button class="tool" data-tool="marquee" title="Marquee (M)">▣<span>Marquee</span></button><button class="tool" data-tool="lasso" title="Lasso (L)">◈<span>Lasso</span></button><button class="tool" data-tool="wand" title="Magic Wand (W)">✦<span>Wand</span></button><button class="tool" data-tool="crop" title="Crop (C)">⊞<span>Crop</span></button><button class="tool" data-tool="rotate" title="Rotate (R)">↻<span>Rotate</span></button><button class="tool" data-tool="zoom" title="Zoom (Z)">🔍<span>Zoom</span></button><button class="tool" data-tool="hand" title="Hand (H)">✋<span>Hand</span></button><button class="tool" data-tool="eyedropper" title="Eyedropper (E)">🎨<span>Pick</span></button><button class="tool" data-tool="brush" title="Brush (B)">🖌<span>Brush</span></button><button class="tool" data-tool="eraser" title="Eraser (Shift+E)">🧹<span>Eraser</span></button><button class="tool" data-tool="bucket" title="Bucket Fill (Shift+B)">🪣<span>Fill</span></button><button class="tool" data-tool="text" title="Text (T)">📝<span>Text</span></button><div class="swatches"><input id="fgColor" type="color" value="#111111" title="Foreground"><input id="bgColor" type="color" value="#ffffff" title="Background"><button id="swapColors" title="Swap colors"  >⇄</button></div></aside>
<section class="canvas-area"><div id="canvasViewport" class="canvas-viewport"><div id="canvasStage" class="canvas-stage"><canvas id="editorCanvas"></canvas><canvas id="overlayCanvas"></canvas></div></div></section>
<aside class="rightbar"><section class="panel properties"><header><h2>Properties</h2></header><div id="propertiesBody"></div></section><section class="panel layers-panel"><header><h2>Layers</h2><div class="layer-controls"><button id="addLayerBtn" title="New Layer">+</button><button id="deleteLayerBtn" title="Delete Layer">−</button></div></header><div id="runtimeLayers" class="layer-list"></div></section></aside></main>
<footer class="statusbar"><span id="status">Ready</span><span id="pointerInfo">x: — y: —</span><span id="layerInfo">Layer: —</span></footer>
<input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden>
<script type="module" src="app.js?v=20"></script>
</body></html>
