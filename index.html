<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PixelForge Studio</title>
  <link rel="stylesheet" href="styles.css?v=16">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="."><span class="brand-mark">✦</span><span>PixelForge <small>STUDIO</small></span></a>
    <div class="actions">
      <button id="open" class="primary" type="button">Open image</button>
      <input id="file" type="file" accept="image/*" hidden>
      <button id="view" type="button" disabled>View</button>
      <button id="export" type="button" disabled>Download PNG</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </header>

  <main class="workspace">
    <section class="editor-shell">
      <div class="editor-toolbar">
        <span id="status">Ready for your next idea</span>
        <div class="zoom-controls">
          <button id="zoomOut" type="button" aria-label="Zoom out">−</button>
          <output id="zoomLabel">100%</output>
          <button id="zoomIn" type="button" aria-label="Zoom in">＋</button>
          <button id="fit" type="button">Fit</button>
        </div>
      </div>

      <div id="stage" class="stage">
        <canvas id="canvas" width="900" height="600"></canvas>
        <div id="empty" class="empty">
          <strong>Drop an image here</strong>
          <span>Open an image to begin editing</span>
        </div>
      </div>
    </section>

    <aside class="inspector">
      <section class="panel option-panel">
        <div class="panel-header">
          <h2>Options</h2>
        </div>

        <div class="option-group" role="tablist" aria-label="Target scope">
          <button class="option-button active" type="button" data-target="whole">Whole image</button>
          <button class="option-button" type="button" data-target="brush">Brush</button>
          <button class="option-button" type="button" data-target="mask">Mask</button>
        </div>

        <div class="control-stack">
          <label class="range-block">
            <span class="label-row">
              <span>Brush size</span>
              <output id="sizeOut">12px</output>
            </span>
            <input id="size" type="range" min="2" max="80" value="12">
          </label>

          <label class="range-block">
            <span class="label-row">
              <span>Strength</span>
              <output id="strengthOut">80%</output>
            </span>
            <input id="strength" type="range" min="10" max="100" value="80">
          </label>
        </div>
      </section>

      <section class="panel layers-panel">
        <div class="panel-header">
          <h2>Layers</h2>
          <button id="addLayer" class="small-button" type="button">＋</button>
        </div>

        <ul id="layersList" class="layers-list"></ul>
      </section>
    </aside>
  </main>

  <script src="app.js?v=16"></script>
</body>
</html>
